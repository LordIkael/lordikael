<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050609"/>
    <stop offset="0.52" stop-color="#090D10"/>
    <stop offset="1" stop-color="#041817"/>
  </linearGradient>
  <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1270 190) rotate(130) scale(360 430)">
    <stop stop-color="#00F5D4" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="120" y1="500" x2="1510" y2="80" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00F5D4" stop-opacity="0"/>
    <stop offset="0.35" stop-color="#00F5D4" stop-opacity="0.45"/>
    <stop offset="0.7" stop-color="#74FFE8" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#7CFFF0" stroke-opacity="0.045"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="clip"><rect width="1600" height="620" rx="34"/></clipPath>
</defs>

<rect width="1600" height="620" rx="34" fill="url(#bg)"/>
<g clip-path="url(#clip)">
  <rect width="1600" height="620" fill="url(#grid)"/>
  <ellipse cx="1280" cy="180" rx="360" ry="300" fill="url(#orb)" filter="url(#soft)"/>

  <!-- technical frame -->
  <path d="M54 92V54H92" stroke="#00F5D4" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M1508 54H1546V92" stroke="#00F5D4" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M54 528V566H92" stroke="#00F5D4" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M1508 566H1546V528" stroke="#00F5D4" stroke-opacity="0.22" stroke-width="2"/>

  <!-- diagonal beam -->
  <path d="M190 528L1450 92" stroke="url(#beam)" stroke-width="2"/>
  <path d="M260 548L1510 115" stroke="#00F5D4" stroke-opacity="0.045"/>

  <!-- right-side system graph -->
  <g opacity="0.65">
    <circle cx="1260" cy="154" r="118" stroke="#9FFDF0" stroke-opacity="0.08"/>
    <circle cx="1260" cy="154" r="74" stroke="#9FFDF0" stroke-opacity="0.1"/>
    <circle cx="1260" cy="154" r="30" stroke="#00F5D4" stroke-opacity="0.2"/>
    <path d="M1144 154H1376M1260 38V270" stroke="#00F5D4" stroke-opacity="0.05"/>
    <path d="M1182 76L1338 232M1338 76L1182 232" stroke="#00F5D4" stroke-opacity="0.04"/>
  </g>

  <!-- terminal window -->
  <g transform="translate(1030 304)">
    <rect x="0" y="0" width="430" height="205" rx="18" fill="#070B0D" fill-opacity="0.9" stroke="#B8FFF6" stroke-opacity="0.11"/>
    <rect x="0" y="0" width="430" height="34" rx="18" fill="#0D1518"/>
    <circle cx="20" cy="17" r="5" fill="#29383B"/>
    <circle cx="38" cy="17" r="5" fill="#29383B"/>
    <circle cx="56" cy="17" r="5" fill="#29383B"/>
    <text x="84" y="22" fill="#607477" font-family="JetBrains Mono, monospace" font-size="11">ikael@lab — system</text>
    <text x="24" y="68" fill="#00F5D4" font-family="JetBrains Mono, monospace" font-size="12">$ whoami</text>
    <text x="24" y="90" fill="#DDF7F3" font-family="JetBrains Mono, monospace" font-size="12">jean-marie / lord-ikael</text>
    <text x="24" y="122" fill="#00F5D4" font-family="JetBrains Mono, monospace" font-size="12">$ focus</text>
    <text x="24" y="144" fill="#DDF7F3" font-family="JetBrains Mono, monospace" font-size="12">software · ai · security · robotics</text>
    <text x="24" y="176" fill="#00F5D4" font-family="JetBrains Mono, monospace" font-size="12">$ status</text>
    <text x="90" y="176" fill="#88A09F" font-family="JetBrains Mono, monospace" font-size="12">BUILDING_</text>
    <rect x="163" y="166" width="7" height="15" fill="#00F5D4" opacity="0.8"/>
  </g>

  <!-- live marker -->
  <g transform="translate(1420 72)">
    <circle cx="0" cy="0" r="7" fill="#00F5D4" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="15" stroke="#00F5D4" stroke-opacity="0.16"/>
  </g>
</g>

<g font-family="Inter, Arial, sans-serif">
  <text x="86" y="105" fill="#6F8585" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="4">IKAEL / ENGINEERING LAB / 001</text>
  <text x="84" y="235" fill="#F7FAF9" font-size="90" font-weight="800" letter-spacing="-5">JEAN-MARIE</text>
  <text x="84" y="325" fill="#00F5D4" font-size="90" font-weight="800" letter-spacing="-5">AGBANGLA</text>
  <text x="88" y="372" fill="#AFC1C0" font-family="JetBrains Mono, monospace" font-size="17" letter-spacing="3">SOFTWARE  ·  AI  ·  SECURITY  ·  SYSTEMS</text>
  <text x="88" y="426" fill="#6D8081" font-family="JetBrains Mono, monospace" font-size="15">BUILDING SOFTWARE / STUDYING SYSTEMS / GOING DEEPER</text>
  <text x="88" y="548" fill="#47595B" font-family="JetBrains Mono, monospace" font-size="13">@tamegnontech</text>
  <text x="1512" y="548" text-anchor="end" fill="#47595B" font-family="JetBrains Mono, monospace" font-size="13">PARAKOU / BENIN</text>
</g>
</svg>
