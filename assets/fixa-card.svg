<svg width="1600" height="700" viewBox="0 0 1600 700" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#070A0C"/><stop offset="1" stop-color="#061C1B"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="900" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5D4" stop-opacity="0.22"/><stop offset="1" stop-color="#00F5D4" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#7CFFF0" stroke-opacity="0.04"/></pattern>
  <clipPath id="clip"><rect width="1600" height="700" rx="32"/></clipPath>
</defs>
<rect width="1600" height="700" rx="32" fill="url(#bg)" stroke="#00F5D4" stroke-opacity="0.16"/>
<g clip-path="url(#clip)">
<rect width="1600" height="700" fill="url(#grid)"/>
<ellipse cx="370" cy="500" rx="520" ry="310" fill="url(#accent)"/>

<text x="66" y="70" fill="#64797A" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="4">02 / CURRENT BUILD</text>
<text x="66" y="155" fill="#F5FAF9" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">FIXA</text>
<text x="70" y="193" fill="#00F5D4" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">TRUST INFRASTRUCTURE FOR TECHNICAL SERVICES</text>
<text x="70" y="235" fill="#8EA2A1" font-family="Inter, Arial, sans-serif" font-size="16">A client ↔ professional platform, starting in Parakou, Benin.</text>

<!-- left feature list -->
<g font-family="Inter, Arial, sans-serif">
  <text x="70" y="305" fill="#DDE9E7" font-size="16" font-weight="700">THE PRODUCT</text>
  <text x="70" y="342" fill="#91A5A4" font-size="14">Professional discovery &amp; matching</text>
  <text x="70" y="376" fill="#91A5A4" font-size="14">Identity, reputation &amp; reviews</text>
  <text x="70" y="410" fill="#91A5A4" font-size="14">Requests, quotes &amp; missions</text>
  <text x="70" y="444" fill="#91A5A4" font-size="14">Messaging &amp; operational workflow</text>
  <text x="70" y="478" fill="#91A5A4" font-size="14">Anti-fraud &amp; access control</text>
</g>

<!-- flow -->
<g transform="translate(70 545)" font-family="JetBrains Mono, monospace" font-size="12">
  <text x="0" y="0" fill="#5E7475" letter-spacing="2">CORE FLOW</text>
  <text x="0" y="36" fill="#DDF5F1">REQUEST</text>
  <text x="104" y="36" fill="#395052">→</text>
  <text x="132" y="36" fill="#DDF5F1">MATCH</text>
  <text x="232" y="36" fill="#395052">→</text>
  <text x="260" y="36" fill="#DDF5F1">CHAT</text>
  <text x="342" y="36" fill="#395052">→</text>
  <text x="370" y="36" fill="#DDF5F1">QUOTE</text>
  <text x="472" y="36" fill="#395052">→</text>
  <text x="500" y="36" fill="#DDF5F1">MISSION</text>
</g>

<!-- right architecture pane -->
<g transform="translate(780 80)">
  <rect x="0" y="0" width="744" height="540" rx="26" fill="#081012" stroke="#BBFFF5" stroke-opacity="0.1"/>
  <text x="34" y="42" fill="#617677" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2">SYSTEM / HIGH-LEVEL</text>
  <g transform="translate(34 78)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="676" height="78" rx="16" fill="#0B1517" stroke="#00F5D4" stroke-opacity="0.16"/>
    <text x="26" y="31" fill="#DDEAE8" font-size="14" font-weight="700">CLIENTS + PROFESSIONALS</text>
    <text x="26" y="55" fill="#708486" font-size="12">mobile-first / role-aware experience</text>
    <path d="M338 78V114" stroke="#00F5D4" stroke-opacity="0.28"/>

    <rect x="0" y="114" width="676" height="92" rx="16" fill="#0B1517" stroke="#00F5D4" stroke-opacity="0.22"/>
    <text x="26" y="149" fill="#00F5D4" font-size="14" font-weight="700">API / MODULAR MONOLITH</text>
    <text x="26" y="175" fill="#708486" font-size="12">auth · matching · missions · messaging · reviews</text>
    <path d="M338 206V242" stroke="#00F5D4" stroke-opacity="0.28"/>

    <rect x="0" y="242" width="320" height="112" rx="16" fill="#0B1517" stroke="#00F5D4" stroke-opacity="0.14"/>
    <text x="24" y="278" fill="#DDEAE8" font-size="13" font-weight="700">POSTGRESQL + POSTGIS</text>
    <text x="24" y="304" fill="#708486" font-size="12">entities · geo · state · integrity</text>
    <rect x="346" y="242" width="330" height="112" rx="16" fill="#0B1517" stroke="#00F5D4" stroke-opacity="0.14"/>
    <text x="370" y="278" fill="#DDEAE8" font-size="13" font-weight="700">OUTBOX / WORKERS</text>
    <text x="370" y="304" fill="#708486" font-size="12">async jobs · notifications · reliability</text>

    <rect x="0" y="386" width="676" height="84" rx="16" fill="#0B1517" stroke="#00F5D4" stroke-opacity="0.1"/>
    <text x="24" y="420" fill="#DDEAE8" font-size="13" font-weight="700">PRIVATE STORAGE + OBSERVABILITY + SECURITY</text>
    <text x="24" y="447" fill="#708486" font-size="12">least privilege · auditability · controlled complexity</text>
  </g>
</g>

<g transform="translate(1500 47)"><circle cx="0" cy="0" r="6" fill="#00F5D4" filter="url(#glow)"/><text x="-76" y="5" fill="#587071" font-family="JetBrains Mono, monospace" font-size="11">ACTIVE</text></g>
</g>
</svg>
